spring:
  application:
    name: auth-service
  datasource:
    # та же БД, что и у task-service
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USER:tasks}
    password: ${DB_PASSWORD:tasks}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: 'classpath:liquibase/main-changelog.xml'

server:
  port: ${SERVER_PORT:8081}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
    access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:1h}
    # Ключи подписи (PEM): AUTH_JWT_PRIVATE_KEY (PKCS#8) и AUTH_JWT_PUBLIC_KEY (X.509), например file:/keys/private.pem.
    # Если не заданы, при старте генерируется временная пара — токены перестанут действовать после перезапуска.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    path: /swagger-ui.html
